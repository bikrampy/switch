{% extends "shop/base.html" %}
{% load static %}
{% block title %} Forgot Password - Switch {% endblock title %}

{% block content %}
  <section class="max-w-md mx-auto px-4 py-24">
    <div class="bg-white border border-stone-100 shadow-xl rounded-2xl p-8 sm:p-10 space-y-8">

      <div class="text-center space-y-2">
        <h2 class="font-serif text-3xl text-stone-950 uppercase tracking-wider">Reset Password</h2>
        <p class="text-stone-500 text-xs font-light font-sans">Enter your email address and we'll send you an OTP to verify your account.</p>
      </div>

      <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
          <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-2">Email Address</label>
          <input type="email" id="email" name="email" placeholder="e.g. name@example.com" required class="w-full px-4 py-3 bg-white border border-stone-200 rounded-lg text-sm text-stone-900 focus:outline-none focus:border-black transition-colors">
        </div>

        <button type="submit" class="w-full py-3.5 bg-black hover:bg-stone-900 text-white font-bold text-xs tracking-widest uppercase rounded-lg shadow-md transition-all">
          Send Verification OTP
        </button>

      </form>


      <div class="text-center text-xs text-stone-500 border-t border-stone-100 pt-6">
        Remember your password? 
        <a href="{% url 'login' %}" class="font-bold text-black hover:underline ml-1">Back to login</a>
      </div>

    </div>
  </section>
{% endblock %}
