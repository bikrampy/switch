{% extends "shop/base.html" %}
{% load static %}
{% block title %} Reset Password - Switch {% endblock title %}

{% block content %}
  <section class="max-w-md mx-auto px-4 py-24">
    <div class="bg-white border border-stone-100 shadow-xl rounded-2xl p-8 sm:p-10 space-y-8">
      
      <!-- Title -->
      <div class="text-center space-y-2">
        <h2 class="font-serif text-3xl text-stone-950 uppercase tracking-wider">Reset Password</h2>
        <p class="text-stone-500 text-xs font-light font-sans">Enter and confirm your new secure password below.</p>
      </div>

      <!-- Form -->
      <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-2">New Password</label>
          <input type="password" id="password" name="password" placeholder="Min. 8 characters" required class="w-full px-4 py-3 bg-white border border-stone-200 rounded-lg text-sm text-stone-900 focus:outline-none focus:border-black transition-colors">
        </div>

        <div>
          <label for="password2" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-2">Confirm New Password</label>
          <input type="password" id="password2" name="password2" placeholder="Confirm your new password" required class="w-full px-4 py-3 bg-white border border-stone-200 rounded-lg text-sm text-stone-900 focus:outline-none focus:border-black transition-colors">
        </div>

        <button type="submit" class="w-full py-3.5 bg-black hover:bg-stone-900 text-white font-bold text-xs tracking-widest uppercase rounded-lg shadow-md transition-all">
          Update Password
        </button>

      </form>

    </div>
  </section>
{% endblock %}
